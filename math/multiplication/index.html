<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4fa">
  <meta name="description" content="跟住 Melody 的節拍，輕鬆溫習二年級 2 至 9 的乘數表。">
  <title>乘數 Melody｜節拍挑戰</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #412d46;
      --muted: #796a80;
      --pink: #e84f91;
      --pink-dark: #b92b70;
      --line: #f0dce8;
      --surface: #fff;
      --background: #fff8fc;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(ellipse at 12% 4%, #ffe1ef 0, transparent 30rem), var(--background); }
    button, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #8e51c7; outline-offset: 3px; }
    .wrap { width: min(940px, calc(100% - 32px)); margin-inline: auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 20px; }
    .brand, .back { color: var(--muted); font-weight: 750; text-decoration: none; }
    .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); }
    .brand-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 14px; background: #ffe2ef; font-size: 1.25rem; }
    .back { padding: 10px 14px; border: 1px solid #efc7db; border-radius: 14px; color: var(--pink-dark); background: #fff; }
    .back:hover { background: #fff0f7; }
    main { padding-block: 14px 54px; }
    .hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 18px; padding: clamp(24px, 5vw, 46px); border: 1px solid #f6d5e5; border-radius: 30px; background: linear-gradient(125deg, #fff 5%, #fff0f7 100%); box-shadow: 0 16px 38px #a4386e12; }
    .eyebrow { margin: 0 0 9px; color: var(--pink-dark); font-size: .82rem; font-weight: 850; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.08; letter-spacing: -.045em; }
    .intro { max-width: 570px; margin: 14px 0 0; color: var(--muted); font-size: 1.08rem; line-height: 1.7; }
    .music-star { display: grid; width: clamp(112px, 21vw, 176px); aspect-ratio: 1; place-items: center; }
    .bunny { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 12px #d9599726); }
    .panel { margin-top: 22px; padding: clamp(20px, 4vw, 34px); border: 1px solid var(--line); border-radius: 26px; background: var(--surface); box-shadow: 0 12px 32px #522d4510; }
    .setup { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
    .table-field { display: grid; gap: 8px; color: var(--ink); font-size: 1rem; font-weight: 800; }
    .table-field-label { color: var(--pink-dark); font-size: 1.08rem; }
    select { min-width: 230px; min-height: 54px; padding: 0 38px 0 14px; border: 2px solid #edb6d0; border-radius: 14px; color: var(--ink); background: #fffafd; font-size: 1rem; font-weight: 800; }
    .primary, .secondary, .answer, .next { min-height: 50px; border: 0; border-radius: 15px; font-weight: 850; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    button:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; transform: none; }
    .primary, .next { padding: 0 22px; color: #fff; background: var(--pink); box-shadow: 0 7px 16px #e84f9138; }
    .primary:hover, .next:hover { background: var(--pink-dark); box-shadow: 0 9px 20px #e84f9144; transform: translateY(-2px); }
    .secondary { padding: 0 18px; border: 1px solid var(--line); color: var(--pink-dark); background: #fff7fb; }
    .secondary:hover { background: #ffeaf4; }
    .hint { margin: 18px 0 0; color: var(--muted); font-size: .94rem; line-height: 1.6; }
    .game { text-align: center; }
    .game-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; color: var(--muted); font-weight: 800; }
    .score { padding: 8px 13px; border-radius: 999px; color: #a23d77; background: #fff0f7; }
    .game-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin: 0 0 15px; }
    .sound-toggle, .leave-game { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; padding: 0 13px; border: 1px solid var(--line); border-radius: 13px; color: var(--pink-dark); background: #fff8fc; font-weight: 800; text-decoration: none; }
    .sound-toggle:hover, .leave-game:hover { background: #ffeaf4; }
    .progress { height: 12px; overflow: hidden; border-radius: 999px; background: #faeaf2; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff9ac4, #e84f91); transition: width .3s ease; }
    .question { margin: clamp(24px, 5vw, 42px) 0 8px; font-size: clamp(2.6rem, 10vw, 5rem); font-weight: 900; letter-spacing: .02em; }
    .question-hint { margin: 0; color: var(--muted); }
    .answers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 27px; }
    .answer { min-height: 76px; border: 2px solid #f5dbe8; color: var(--ink); background: #fffafd; font-size: clamp(1.45rem, 5vw, 2rem); }
    .answer:hover:not(:disabled) { border-color: #ed8ab7; background: #fff1f7; transform: translateY(-2px); }
    .answer:disabled { cursor: default; opacity: .8; }
    .answer.correct { border-color: #73c89e; color: #176d47; background: #e8fff2; opacity: 1; }
    .answer.wrong { border-color: #e58b98; color: #9c3448; background: #fff0f2; opacity: 1; }
    .feedback { min-height: 32px; margin: 18px 0 0; color: var(--muted); font-size: 1.08rem; font-weight: 800; }
    .feedback.good { color: #18764d; }
    .feedback.try-again { color: #a13c50; }
    .learning-hint { margin: 0 0 12px; color: var(--ink); line-height: 1.65; }
    .next { margin-top: 4px; }
    .result-emoji { margin: 0 0 8px; font-size: 3.5rem; }
    .result-title { margin: 0; font-size: clamp(1.8rem, 6vw, 2.7rem); }
    .result-copy { margin: 12px 0 22px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .sticker { display: inline-block; margin: 2px 0 16px; padding: 11px 18px; border: 2px dashed #efb6d2; border-radius: 18px; color: #9c356d; background: #fff3f9; font-weight: 850; }
    .result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .review { margin-top: 18px; }
    .review h2 { margin: 0 0 14px; font-size: 1.25rem; }
    .table-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; }
    .fact { padding: 12px 6px; border: 1px solid #f5dce9; border-radius: 13px; background: #fff8fc; text-align: center; font-size: clamp(.85rem, 2vw, 1rem); font-weight: 800; }
    .hidden { display: none !important; }
    footer { padding: 0 4px; color: var(--muted); font-size: .9rem; line-height: 1.6; text-align: center; }
    @media (max-width: 600px) {
      .hero { grid-template-columns: 1fr auto; gap: 10px; padding: 23px 20px; border-radius: 23px; }
      .intro { font-size: 1rem; }
      .music-star { width: 92px; }
      .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .answer { min-height: 68px; }
      .table-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game-top { font-size: .9rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="brand" href="../../"><span class="brand-icon" aria-hidden="true">🎓</span><span>LWCPS Learning</span></a>
    <a class="back" href="../../">← 返回學習天地</a>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div>
        <p class="eyebrow">🎶 二年級數學・音符派對</p>
        <h1 id="title">乘數 Melody</h1>
        <p class="intro">跟住節拍玩乘數表！慢慢諗都得，答啱就儲星星，一齊完成 10 題挑戰。</p>
      </div>
      <div class="music-star" aria-hidden="true">
        <svg class="bunny" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <path d="M81 92C56 75 34 31 44 14c8-14 30-7 43 12 13 19 18 42 17 61" fill="#ed6da5" stroke="#b92b70" stroke-width="5"/>
          <path d="M68 64C55 44 51 24 57 21c7-4 19 11 27 27 7 14 10 29 10 41" fill="#ffc9de"/>
          <path d="M145 88c-11-25-8-72 9-82 14-8 29 9 31 32 2 22-8 46-22 61" fill="#ed6da5" stroke="#b92b70" stroke-width="5"/>
          <path d="M157 61c-3-21 1-39 8-42 7-2 12 16 11 33-1 14-5 27-12 38" fill="#ffc9de"/>
          <ellipse cx="120" cy="142" rx="74" ry="66" fill="#fff9fc" stroke="#b92b70" stroke-width="5"/>
          <path d="M95 143c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#53364b" stroke-linecap="round" stroke-width="6"/>
          <path d="M128 143c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#53364b" stroke-linecap="round" stroke-width="6"/>
          <ellipse cx="83" cy="159" rx="12" ry="7" fill="#ffb6d2"/>
          <ellipse cx="157" cy="159" rx="12" ry="7" fill="#ffb6d2"/>
          <path d="M115 153q5-6 10 0-5 7-10 0m5 5c-2 8-8 10-13 6m13-6c2 8 8 10 13 6" fill="#e84f91" stroke="#b92b70" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
          <path d="M90 178h-17m18 7-15 5m115-12h-17m16 7 15 5" fill="none" stroke="#bd7697" stroke-linecap="round" stroke-width="3"/>
          <path d="m193 90 5 10 11 1-8 7 2 11-10-6-10 6 2-11-8-7 11-1z" fill="#ffc94f"/>
          <path d="M42 104v-13m-6 7h12" stroke="#e84f91" stroke-linecap="round" stroke-width="4"/>
        </svg>
      </div>
    </section>

    <section id="setup" class="panel" aria-labelledby="setup-title">
      <h2 id="setup-title">第一步：先揀乘數表 🎯</h2>
      <div class="setup">
        <label class="table-field" for="table-select"><span class="table-field-label">揀一個乘數表（2 至 9）</span>
          <select id="table-select" required>
            <option value="" selected disabled>請先選擇乘數表</option>
            <option value="2">2 的乘數表</option>
            <option value="3">3 的乘數表</option>
            <option value="4">4 的乘數表</option>
            <option value="5">5 的乘數表</option>
            <option value="6">6 的乘數表</option>
            <option value="7">7 的乘數表</option>
            <option value="8">8 的乘數表</option>
            <option value="9">9 的乘數表</option>
          </select>
        </label>
        <button id="start-button" class="primary" type="button" disabled>開始 10 題挑戰 ✨</button>
        <button id="review-button" class="secondary" type="button" disabled aria-expanded="false" aria-controls="review">先溫習乘數表</button>
      </div>
      <p class="hint">請先選好乘數表，再按「開始挑戰」或先溫習。每回合會玩晒 1 至 10，完成挑戰就有貼紙！唔使趕時間。</p>
      <div id="review" class="review hidden">
        <h2 id="review-title">2 的乘數表</h2>
        <div id="table-grid" class="table-grid"></div>
      </div>
    </section>

    <section id="game" class="panel game hidden" aria-labelledby="question" aria-live="polite">
      <div class="game-top">
        <span id="question-count">第 1 / 10 題</span>
        <span id="score" class="score">⭐ 0 分　🔥 0 連勝</span>
      </div>
      <div class="game-controls">
        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">🔊 音效開</button>
        <button id="quit-button" class="sound-toggle" type="button">🎯 揀另一個挑戰</button>
        <a class="leave-game" href="../../">↩ 返回學習天地</a>
      </div>
      <div class="progress" role="progressbar" aria-label="挑戰進度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <h2 id="question" class="question" tabindex="-1"></h2>
      <p class="question-hint">揀出正確答案！</p>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <p id="learning-hint" class="learning-hint" aria-live="polite"></p>
      <button id="next-button" class="next hidden" type="button">下一題 →</button>
    </section>

    <section id="result" class="panel game hidden" aria-live="polite"></section>
    <p id="sound-status" class="hint" role="status"></p>
    <footer>每一次練習都值得一個掌聲 👏　｜　慢慢來，記住就係你嘅本領！</footer>
  </main>
  <script>
    const setup = document.querySelector("#setup");
    const game = document.querySelector("#game");
    const result = document.querySelector("#result");
    const tableSelect = document.querySelector("#table-select");
    const review = document.querySelector("#review");
    const reviewButton = document.querySelector("#review-button");
    const startButton = document.querySelector("#start-button");
    const soundToggle = document.querySelector("#sound-toggle");
    const quitButton = document.querySelector("#quit-button");
    const questionCount = document.querySelector("#question-count");
    const scoreDisplay = document.querySelector("#score");
    const progress = document.querySelector(".progress");
    const progressFill = document.querySelector("#progress-fill");
    const question = document.querySelector("#question");
    const answers = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const learningHint = document.querySelector("#learning-hint");
    const soundStatus = document.querySelector("#sound-status");
    const nextButton = document.querySelector("#next-button");
    const totalQuestions = 10;
    let table = 2;
    let questionNumber = 0;
    let score = 0;
    let streak = 0;
    let currentAnswer = 0;
    let currentMultiplier = 0;
    let multipliers = [];
    let answered = false;
    let soundEnabled = true;
    let audioContext = null;
    let masterVolume = null;
    let soundRequest = 0;

    function disableSound() {
      soundEnabled = false;
      soundRequest += 1;
      soundToggle.disabled = true;
      soundToggle.setAttribute("aria-pressed", "false");
      soundToggle.textContent = "🔇 音效未能播放";
      soundStatus.textContent = "音效未能播放，仍然可以繼續玩。";
    }

    function playFeedback(kind) {
      if (!soundEnabled) return;
      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) {
        disableSound();
        return;
      }
      const request = ++soundRequest;
      try {
        if (!audioContext) {
          audioContext = new AudioContextConstructor();
          masterVolume = audioContext.createGain();
          masterVolume.gain.setValueAtTime(0.12, audioContext.currentTime);
          masterVolume.connect(audioContext.destination);
        }
        const playNotes = () => {
          if (!soundEnabled || request !== soundRequest) return;
          try {
            const melodies = {
              correct: [523.25, 659.25, 783.99],
              streak: [659.25, 783.99, 987.77, 1046.5],
              wrong: [392, 349.23],
              finish: [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5],
            };
            const notes = melodies[kind];
            notes.forEach((frequency, index) => {
              const startAt = audioContext.currentTime + index * 0.105;
              [1, 2].forEach((harmonic) => {
                const oscillator = audioContext.createOscillator();
                const volume = audioContext.createGain();
                oscillator.type = harmonic === 1 ? "triangle" : "sine";
                oscillator.frequency.setValueAtTime(frequency * harmonic, startAt);
                volume.gain.setValueAtTime(0.0001, startAt);
                volume.gain.exponentialRampToValueAtTime(harmonic === 1 ? 0.55 : 0.12, startAt + 0.01);
                volume.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.2);
                oscillator.connect(volume);
                volume.connect(masterVolume);
                oscillator.start(startAt);
                oscillator.stop(startAt + 0.21);
              });
            });
          } catch (error) {
            console.error("Unable to play quiz sound:", error);
            disableSound();
          }
        };
        if (audioContext.state === "suspended") {
          audioContext.resume().then(playNotes).catch((error) => {
            console.error("Unable to resume quiz audio:", error);
            disableSound();
          });
        } else {
          playNotes();
        }
      } catch (error) {
        console.error("Unable to start quiz audio:", error);
        disableSound();
      }
    }

    function renderTable() {
      const selectedTable = Number(tableSelect.value);
      document.querySelector("#review-title").textContent = `${selectedTable} 的乘數表`;
      document.querySelector("#table-grid").replaceChildren(...Array.from({ length: 10 }, (_, index) => {
        const multiplier = index + 1;
        const card = document.createElement("div");
        card.className = "fact";
        card.textContent = `${selectedTable} × ${multiplier} = ${selectedTable * multiplier}`;
        return card;
      }));
    }

    function shuffled(values) {
      for (let index = values.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [values[index], values[other]] = [values[other], values[index]];
      }
      return values;
    }

    function makeChoices(answer) {
      const choices = new Set([answer]);
      while (choices.size < 4) {
        const offset = Math.floor(Math.random() * 15) + 1;
        const choice = Math.random() < 0.5 ? answer + offset : answer - offset;
        if (choice > 0 && choice <= 90) choices.add(choice);
      }
      return shuffled([...choices]);
    }

    function updateScore() {
      scoreDisplay.textContent = `⭐ ${score} 分　🔥 ${streak} 連勝`;
    }

    function showQuestion() {
      questionNumber += 1;
      answered = false;
      currentMultiplier = multipliers[questionNumber - 1];
      currentAnswer = table * currentMultiplier;
      questionCount.textContent = `第 ${questionNumber} / ${totalQuestions} 題`;
      question.textContent = `${table} × ${currentMultiplier} = ?`;
      progress.setAttribute("aria-valuenow", questionNumber - 1);
      progressFill.style.width = `${((questionNumber - 1) / totalQuestions) * 100}%`;
      feedback.textContent = "";
      learningHint.textContent = "";
      feedback.className = "feedback";
      nextButton.classList.add("hidden");
      answers.replaceChildren(...makeChoices(currentAnswer).map((value, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = value;
        button.setAttribute("aria-label", `答案 ${index + 1}：${value}`);
        button.addEventListener("click", () => checkAnswer(value));
        return button;
      }));
      question.focus();
    }

    function checkAnswer(value) {
      if (answered) return;
      answered = true;
      const correct = value === currentAnswer;
      if (correct) {
        score += 1;
        streak += 1;
        playFeedback(streak >= 3 ? "streak" : "correct");
        feedback.textContent = streak > 1 ? `答啱！好犀利，已經連勝 ${streak} 題！🎉` : "答啱啦！好叻呀！🎉";
        feedback.className = "feedback good";
      } else {
        streak = 0;
        playFeedback("wrong");
        feedback.textContent = `差少少！正確答案係 ${currentAnswer}，記住下次再試！💪`;
        feedback.className = "feedback try-again";
        learningHint.textContent = `小貼士：${table} × ${currentMultiplier} = ${Array(currentMultiplier).fill(table).join(" + ")} = ${currentAnswer}`;
      }
      updateScore();
      progress.setAttribute("aria-valuenow", questionNumber);
      progressFill.style.width = `${(questionNumber / totalQuestions) * 100}%`;
      answers.querySelectorAll("button").forEach((button) => {
        const buttonValue = Number(button.textContent);
        button.disabled = true;
        if (buttonValue === currentAnswer) button.classList.add("correct");
        else if (buttonValue === value) button.classList.add("wrong");
      });
      nextButton.textContent = questionNumber === totalQuestions ? "睇成績 ✨" : "下一題 →";
      nextButton.classList.remove("hidden");
      nextButton.focus();
    }

    function finishGame() {
      game.classList.add("hidden");
      result.classList.remove("hidden");
      playFeedback("finish");
      const stars = score >= 9 ? "🌟🌟🌟" : score >= 6 ? "🌟🌟" : "🌟";
      const cheer = score === totalQuestions ? "全對！你係乘數表小天才！" : score >= 7 ? "做得好好！繼續保持！" : "練習令你愈來愈叻，再玩一次啦！";
      result.innerHTML = `
        <p class="result-emoji" aria-hidden="true">${stars}</p>
        <h2 class="result-title">挑戰完成！</h2>
        <p class="result-copy">${cheer}<br>今次答啱 <strong>${score} / ${totalQuestions}</strong> 題，儲到 ${score} 分！</p>
        <p class="sticker">🐰 努力練習貼紙・送畀你！</p>
        <div class="result-actions">
          <button id="play-again" class="primary" type="button">再玩一次 🎶</button>
          <button id="choose-table" class="secondary" type="button">揀另一個乘數表</button>
        </div>`;
      document.querySelector("#play-again").addEventListener("click", startGame);
      document.querySelector("#choose-table").addEventListener("click", () => {
        result.classList.add("hidden");
        setup.classList.remove("hidden");
        document.querySelector("#start-button").focus();
      });
      document.querySelector("#play-again").focus();
    }

    function startGame() {
      if (!tableSelect.value) {
        tableSelect.focus();
        return;
      }
      table = Number(tableSelect.value);
      questionNumber = 0;
      score = 0;
      streak = 0;
      multipliers = shuffled(Array.from({ length: totalQuestions }, (_, index) => index + 1));
      updateScore();
      setup.classList.add("hidden");
      result.classList.add("hidden");
      game.classList.remove("hidden");
      showQuestion();
    }

    startButton.addEventListener("click", startGame);
    document.querySelector("#next-button").addEventListener("click", () => {
      if (questionNumber === totalQuestions) finishGame();
      else showQuestion();
    });
    document.querySelector("#review-button").addEventListener("click", () => {
      const isOpen = !review.classList.contains("hidden");
      review.classList.toggle("hidden", isOpen);
      reviewButton.setAttribute("aria-expanded", String(!isOpen));
      reviewButton.textContent = isOpen ? "先溫習乘數表" : "收起乘數表";
      if (!isOpen) renderTable();
    });
    tableSelect.addEventListener("change", () => {
      const hasSelection = Boolean(tableSelect.value);
      startButton.disabled = !hasSelection;
      reviewButton.disabled = !hasSelection;
      if (!review.classList.contains("hidden")) renderTable();
    });
    quitButton.addEventListener("click", () => {
      game.classList.add("hidden");
      setup.classList.remove("hidden");
      tableSelect.focus();
    });
    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundRequest += 1;
      if (masterVolume) masterVolume.gain.setValueAtTime(soundEnabled ? 0.12 : 0, audioContext.currentTime);
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      soundToggle.textContent = soundEnabled ? "🔊 音效開" : "🔇 音效關";
    });
  </script>
</body>
</html>
